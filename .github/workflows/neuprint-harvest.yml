name: neuprint harvest

# Fetches where APL's and DPM's synapses are, region by region, from neuPrint (tools/harvest_neuprint_rois.py)
# and commits data/mb_roi_connectivity.json.gz back to the branch. neuPrint needs a personal token: the
# repository secret NEUPRINT_TOKEN. Run it from the Actions tab (workflow_dispatch); it also runs when the
# harvest script or this file changes on a claude/ branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - tools/harvest_neuprint_rois.py
      - .github/workflows/neuprint-harvest.yml

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install neuprint-python
        run: python -m pip install neuprint-python==0.6.3
      - name: Fetch the region table
        env:
          NEUPRINT_APPLICATION_CREDENTIALS: ${{ secrets.NEUPRINT_TOKEN }}
        run: python tools/harvest_neuprint_rois.py --out data/mb_roi_connectivity.json.gz
      - name: Commit it back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mb_roi_connectivity.json.gz
          if git diff --cached --quiet; then echo "the table is unchanged"; exit 0; fi
          git commit -m "Harvest where APL's and DPM's synapses are, region by region, from neuPrint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
