[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-fly"
version = "2.0.0"
description = "A whole fruit-fly nervous system (MaleCNS v1.0 connectome) as a leaky integrate-and-fire simulator, plus a browser game driven by it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "playwright"]

[project.scripts]
fly-brain = "virtual_fly.cli:main"
fly-game = "virtual_fly.play:main"

[tool.setuptools.packages.find]
include = ["virtual_fly*"]

[tool.setuptools.package-data]
virtual_fly = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
